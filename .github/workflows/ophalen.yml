name: Events ophalen

on:
  schedule:
    - cron: "17 5 * * *"   # elke dag rond 6-7 uur Belgische tijd
  workflow_dispatch: {}     # ook handmatig te starten via de knop "Run workflow"

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bronnen ophalen
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: python ophalen.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "latin-agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/afgewezen.json data/cache/geocode.json
          git diff --cached --quiet || git commit -m "Events bijgewerkt $(date +%F)"
          git push
